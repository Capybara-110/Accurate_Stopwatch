<!DOCTYPE html>
<html>
<head>
  <title>Accurate Stopwatch</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
      background-color: #333;
    }
    .stopwatch-wrapper {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center; /* Щоб кнопки були по центру */
      margin: 8% auto;
    }
    #stopwatch {
      font-size: 2.2em;
      font-family: 'Courier New', Courier, monospace;
      color: #2c3e50; /* Базовий колір тексту цифр */
      background-color: #ecf0f1;
      padding: 12px 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
      letter-spacing: 1px;
    }
    .digit, .colon, .ms-digits {
      display: inline-block;
      /* transition тут не потрібен, якщо використовуємо @keyframes для конкретного ефекту */
    }
    .digit {
        min-width: 0.6em; 
        text-align: center;
    }

    /* Анімація пульсу */
    @keyframes briefPulse {
      0% { 
        transform: scale(1); 
        /* color: #2c3e50;  Можна залишити базовий або трохи змінити */
      }
      50% { 
        transform: scale(1.15); /* Трохи більше збільшення */
        color: #e74c3c;     /* Яскравий колір для акценту */
      }
      100% { 
        transform: scale(1); 
        /* color: #2c3e50; */
      }
    }

    .digit.pulse-animate {
      /* animation-name, animation-duration, animation-timing-function, animation-iteration-count */
      animation: briefPulse 0.25s ease-out 1; /* 0.25s - тривалість одного "пульсу", 1 раз */
    }


    #controls button {
      font-size: 0.9em;
      padding: 10px 0;
      margin: 5px;
      width: 80px; 
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease, color 0.2s ease;
      color: white;
      box-sizing: border-box;
    }
    #controls button:disabled {
      background-color: #bdc3c7 !important; 
      cursor: not-allowed;
      opacity: 0.7;
    }
    #actionButton:hover:not(:disabled),
    #resetButton:hover:not(:disabled) {
        filter: brightness(90%);
    }
  </style>
</head>
